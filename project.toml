purpose = "Adapted from upstream replica-diff: weighted feature-parity scoring against the feature matrix plus a dependency-free screenshot layout diff (parity.py, imgdiff.py)"
reviewed_on = "2026-10-06"
permissions = "project-local"
rollback = "remove the .agents/skills/parity-check directory and its [[skills]] entry"

