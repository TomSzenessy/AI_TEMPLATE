# The manifest is the machine-readable source of truth for repository shape,
# verification commands, launch state, and reviewed skill provenance.
# Keep product meaning in code/specs; keep live work in GitHub Issues.
schema = 1
name = "AI_TEMPLATE"
kind = "template"
phase = "development"
# The root LICENSE file is authoritative; this SPDX label is metadata, not proof
# that the text matches it. Replace both deliberately.
license = "MIT"
owners = ["TomSzenessy"]

[repository]
default_branch = "main"
# Set github = "owner/name" when the checkout has no trusted GitHub remote.
github = "TomSzenessy/AI_TEMPLATE"
# Add project-specific generated/infrastructure paths here when the defaults
# are not enough. Product surfaces still belong in [[surfaces]].
infrastructure_paths = []
# Single source for the README description block and the GitHub repository
# metadata (`make sync` renders the README; `make github-sync` applies GitHub).
description = "Self-healing starting point for AI-agent-built projects of any size: docs bound to code, generated host adapters, delegation roles, and deterministic gates for any agent or model."
topics = ["ai-agents", "agents-md", "claude-code", "codex", "mcp", "template", "self-healing", "developer-tools"]
is_template = true

[template]
# Template-only material that `make init` removes from new projects; relative
# links to removed files are rewritten to `source` so nothing breaks.
source = "https://github.com/TomSzenessy/AI_TEMPLATE"
prune = ["docs/research/**", ".agents/trials/**"]

[vision]
status = "accepted"
record = "VISION.md"
stack_decision = "docs/STACK-DECISION.md"

[governance]
profile = "agent-first"
issue_template = "docs/ISSUE_TEMPLATE.md"
label_registry = ".github/issue-labels.json"

[resources]
# Read-only resource/MCP starting points; never an automatic install manifest.
registry = "resources.toml"

[adapters]
# Hosts that get generated adapter files (docs/self-healing.md#host-adapters).
# Codex, Copilot, and Cursor read AGENTS.md and .agents/ without adapters.
hosts = ["claude"]

# Optional per-host overrides; omitted keys keep the kit defaults.
# [adapters.claude]
# models = { fast = "haiku", balanced = "sonnet", deep = "opus" }   # role tier -> model
# tools = { "read-only" = "Read, Grep, Glob, Bash" }               # role access -> tools
# allow = ["make start", "make done", "make where:*"]               # pre-approved commands

[kit]
# Optional tunables (docs/self-healing.md); omitted keys keep the defaults.
# doc_groups = { operate = "Start and operate", design = "Design and engineering", launch = "Product, privacy, and launch", extend = "Extensibility and evidence" }
# unbound_docs_ok = ["docs/legal/**", "docs/research/**"]
# overlap_limit = 0.30
# deprecation_warning_days = 30
# skill_review_days = 365
# eval_model = "haiku"   # model for `make eval` on Claude (cheap by default)

[packs]
# Capability packs (.agents/packs/): omitted packs keep their default. The
# template measures its own changes with fresh agents (make eval, make trial).
measure = true

[capabilities]
# First-party skills written in this repository (`make new KIND=skill` adds
# them here). Third-party skills instead need [[skills]] provenance below.
local_skills = ["product-kickoff", "stack-foundation", "ux-quality"]

[budgets]
# Byte limits (~4 bytes/token) for files agents load often; make check enforces.
"AGENTS.md" = 7500
"docs/README.md" = 9500
"tools/kit/*.py" = 32000  # keep kit modules agent-sized; add budgets for product code too
".agents/agents/*.md" = 3000
".agents/skills/*/SKILL.md" = 8000

[risk]
# Ceremony tiers for `make risk` (first match wins, high before low; the rest
# is normal). Tune per project; never widen low to dodge a gate.
high = [
  "tools/**", ".github/**", ".security/**", "project.toml", "resources.toml",
  "AGENTS.md", "CLAUDE.md", "GEMINI.md", ".agents/**", ".claude/**", ".mcp.json",
  "**/auth/**", "**/migrations/**", "**/*.sql", "**/secrets/**", "**/infra/**",
]
low = ["docs/**", "**/*.md"]
# ceremony = { normal = "issue, focused test, make done, observed artifact" }   # optional per-tier text

[security]
contact = ""
private_reporting = ""

[launch]
legal_review = "pending"
# Public launch: local review record with Counsel review, Reviewer, Date.
legal_review_ref = ""
production_evidence = "unverified"
# Public launch: local artifacts with Evidence type: deployed, Observed,
# Reviewer, and Date. External provider/counsel gates stay linked issues.
production_evidence_refs = []
# Public launch must list final, placeholder-free documents under docs/legal/.
legal_document_paths = []

# Add one entry per independently verifiable product or creative surface.
# Example:
# [[surfaces]]
# id = "app"
# path = "apps/app"
# kind = "code"
# status = "active"
# owner = "team-or-person"
# quality_oracle = "Playwright smoke test plus a fresh visual review"
# critic_evidence = ["artifacts/reviews/app-123.md"]
# verification = [["npm", "ci"], ["npm", "test"]]
# garden = [["npx", "knip"]]   # optional rot finders run by `make garden`
#
# Reviewed third-party skills are recorded as provenance, not installed globally.
# Retain a verified capability while it remains trusted and useful; update the
# digest/review whenever its vendored tree or source changes.
# [[skills]]
# package = "owner/repository@skill"
# source = "https://github.com/owner/repository"
# revision = "40-character-commit-sha-or-sha256:<64-hex-digest>"
# content_digest = "sha256:<64-hex-digest>"
# purpose = "bounded capability"
# reviewed_on = "YYYY-MM-DD"
# permissions = "read-only / project-local"
# rollback = "remove the project-local skill and restore the previous lockfile"
#
# A surface is not a folder to fill mechanically. Add it when the requirement
# exists, then give it an owner, a quality oracle, and evidence-producing checks.

[[surfaces]]
id = "template"
path = "."
kind = "template"
owner = "TomSzenessy"
status = "active"
quality_oracle = "Fresh-agent navigation, contract checks, and bounded review packet inspection"
verification = [["tools/repoctl", "check"]]

# Reviewed capability pack adapted from Jakeschincariol/replica-skill (MIT).
# `purpose` names the upstream skill each local skill adapts, because adapted
# skills may be renamed; THIRD_PARTY_NOTICES.md holds the full mapping.
[[skills]]
package = "Jakeschincariol/replica-skill@product-recon"
pack = "product"
source = "https://github.com/Jakeschincariol/replica-skill"
revision = "77c9436fb3d18c3d58169efb8caf4fe906b0dc51"
content_digest = "sha256:80bfbb95202612855aba132a383281db8a50341fcbd14568751684dbbe75422e"
purpose = "Adapted from upstream replica-recon: map a reference product into an evidence-backed spec (sources, screens with states, flows, inferred data model, feature matrix) under clean-room rules"
reviewed_on = "2026-10-06"
permissions = "project-local"
rollback = "remove the .agents/skills/product-recon directory and its [[skills]] entry"

