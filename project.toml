revision = "77c9436fb3d18c3d58169efb8caf4fe906b0dc51"
content_digest = "sha256:1a5eca5a514c9a01d467dcb9c7f96cb4e7926b1eef498e6f133e3879d1e1327a"
purpose = "Adapted from upstream replica-design: measure a reference interface into design tokens and component specs, gated by the WCAG contrast checker (contrast.py, tokens.json)"
reviewed_on = "2026-10-06"
permissions = "project-local"
rollback = "remove the .agents/skills/design-tokens directory and its [[skills]] entry"

[[skills]]
package = "Jakeschincariol/replica-skill@review-mining"
pack = "product"
source = "https://github.com/Jakeschincariol/replica-skill"
revision = "77c9436fb3d18c3d58169efb8caf4fe906b0dc51"
content_digest = "sha256:b46fad33bdf857e5e725fcaa4e3b32ab055aca054b31cedf721aa6403f609302"
purpose = "Adapted from upstream replica-entrepreneur: rank real user complaints from linked verbatim quotes into a fix plan and positioning angle (reviews.py, themes.json)"
