name: ci

on:
  # Pull requests and the merge queue run the full path; pushes only on the
  # default branch, so a pull request's commits are not verified twice.
  push:
    branches: [main]
  pull_request:
    # `gh pr ready` must start the first non-draft run (#152).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; main verifications finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # A draft PR is still being edited: it must not spend CI minutes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: repository verification (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # gh run list/view for tree-hash reuse
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.x is the latest stable release.
        python: ["3.11", "3.x"]
    steps:
      - name: Check out pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets make verify detect stale documents (docs/self-healing.md).
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Decide tree-hash reuse
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse=$(python3 tools/repoctl.py --root . ci tree-reuse)
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Run the verification gate on the matrix interpreter
        # The adopted copy (kit-ci.yml) runs only `repoctl check`; docs/adopt.md says why.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          REPOCTL_SETUP: "1"  # runs each surface's declared setup (toolchain install) before its verification
        run: python3 tools/repoctl.py --root . ci gate
      - name: Reuse a verified tree
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "Tree already verified by a successful ci run; heavy verification skipped."
  test-future:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: tests 800 days ahead (no calendar rot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # gh run list/view for tree-hash reuse
    timeout-minutes: 30
    steps:
      - name: Check out pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Decide tree-hash reuse
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse=$(python3 tools/repoctl.py --root . ci tree-reuse)
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Run the tests 800 days ahead
        if: steps.reuse.outputs.reuse != 'true'
        run: KIT_SLOW=1 make test-future
      - name: Reuse a verified tree
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "Tree already verified by a successful ci run; calendar test skipped."
