name: ci

on:
  # Pull requests run the full path; pushes only on the default branch, so a
  # pull request's commits are not verified twice.
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: repository verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets make verify detect stale documents (docs/self-healing.md).
          fetch-depth: 0
          persist-credentials: false
      - name: Run the declared verification path
        run: make verify
