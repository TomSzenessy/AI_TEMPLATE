name: Issue contract

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, transferred]

permissions:
  contents: read
  issues: write

jobs:
  canonical-contract:
    name: canonical issue contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate classification and disclosure fields
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 tools/repoctl.py --root . ci issue-contract
