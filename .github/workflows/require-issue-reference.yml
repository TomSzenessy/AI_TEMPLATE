name: Require issue reference

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-reference:
    if: github.actor != 'dependabot[bot]'
    name: issue reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The validator reads project.toml (governance profile), so check out the
      # pull request's tree; read-only token, no persisted credentials.
      - name: Check out pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: python3 tools/repoctl.py --root . ci pr-reference
