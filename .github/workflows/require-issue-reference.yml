name: Require issue reference

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read
  security-events: read

jobs:
  issue-reference:
    if: github.actor != 'dependabot[bot]'
    name: issue reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          body = event.get("pull_request", {}).get("body") or ""
          references = sorted(set(re.findall(r"\b(?:Closes|Fixes|Refs)\s+#([1-9][0-9]*)\b", body, re.I)))
          private_reference = re.search(
              r"(?im)^\s*Security-Reference:\s*(?:GHSA-[0-9a-z-]{4,}|https://github\.com/[^\s]+/security/advisories/[^\s]+)\s*$",
              body,
          )
          security_owner = re.search(r"(?im)^\s*Security-Owner:\s*@?[A-Za-z0-9][A-Za-z0-9-]{1,39}\s*$", body)
          if private_reference and not security_owner:
              raise SystemExit("Private security references require a named Security-Owner")
          if not references and not private_reference:
              raise SystemExit("PR body must include Closes/Fixes/Refs #<number> or a private Security-Reference")

          repository = os.environ["GITHUB_REPOSITORY"]
          api_root = os.environ["GITHUB_API_URL"].rstrip("/")
          for number in references:
              request = urllib.request.Request(
                  f"{api_root}/repos/{repository}/issues/{number}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  issue = json.load(response)
              if "pull_request" in issue:
                  raise SystemExit(f"#{number} is a pull request, not an issue")
          if private_reference:
              advisory_value = private_reference.group(1)
              advisory_match = re.search(r"GHSA-[0-9a-z-]{4,}", advisory_value, re.I)
              if not advisory_match:
                  raise SystemExit("Private security reference must contain a GHSA identifier")
              advisory_id = advisory_match.group(0).upper()
              request = urllib.request.Request(
                  f"{api_root}/repos/{repository}/security-advisories/{advisory_id}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      advisory = json.load(response)
              except Exception as error:
                  raise SystemExit(f"Private security advisory could not be verified: {advisory_id}") from error
              owner = security_owner.group(1).lstrip("@").casefold()
              repository_owner = repository.split("/", 1)[0].casefold()
              advisory_owner = str((advisory.get("user") or {}).get("login", "")).casefold()
              if owner not in {repository_owner, advisory_owner}:
                  raise SystemExit("Security-Owner is not trusted by the advisory metadata")
              print(f"Private security advisory verified: {advisory_id}")
          else:
              print(f"Validated issue references: {', '.join('#' + n for n in references)}")
          PY
