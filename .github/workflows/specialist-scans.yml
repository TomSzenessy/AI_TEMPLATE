name: specialist scans

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: specialist-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    if: github.event_name != 'pull_request'
    name: maintained secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  links:
    name: maintained Markdown link scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Exact-path exclusions are manually reviewed primary sources that
          # reject automated clients; do not broaden these to whole domains.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,202,206
            --exclude 'https://www\.gesetze-im-internet\.de/.*'
            --exclude 'https://openai\.com/index/harness-engineering/?'
            --exclude 'https://www\.iso\.org/standard/(74393|78176|81291)\.html'
            './**/*.md'
          fail: true
