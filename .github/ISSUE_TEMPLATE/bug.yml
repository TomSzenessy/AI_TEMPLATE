name: Bug report
description: Report a reproducible defect with a regression boundary.
title: "[bug/P1] concise symptom and impact"
body:
  - type: markdown
    attributes:
      value: "public-safe intake only. For active vulnerabilities, secrets, or personal data use SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concrete user-visible outcome, scope, and non-goals.
    validations:
      required: true
  - type: textarea
    id: duplicate
    attributes:
      label: Duplicate check
      description: "Write: Duplicate check: searched title, symptom, and path for <terms>; no duplicate found (or reused #N)."
    validations:
      required: true
  - type: input
    id: type
    attributes:
      label: Type
      description: Use `bug`.
    validations:
      required: true
  - type: input
    id: priority
    attributes:
      label: Priority
      placeholder: P0, P1, P2, or P3
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: repo, web, game, media, data, security, privacy, legal, operations
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      description: One stable lowercase kebab-case topic.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: [triage, ready, in-progress, blocked]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Include a positive criterion and a negative/regression criterion with observable evidence."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Include the evidence type (test/source/deployed/provider/hardware/counsel), acceptance criteria with a positive and negative case, and an Artifact/Commit/Diff reference."
    validations:
      required: true
  - type: textarea
    id: disclosure
    attributes:
      label: Disclosure classification
      description: "Include Public-safe: yes; Security/privacy review: <not applicable or review>; Reviewer/date: <name and YYYY-MM-DD>."
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies and handoff
      description: "Owner / next action, affected path, and external gate if any."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Intake checks
      options:
        - label: I searched existing issues and the error ledger.
          required: true
        - label: I reviewed this body for public disclosure; sensitive findings use the private route.
          required: true
