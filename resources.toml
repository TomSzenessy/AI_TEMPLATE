# Machine-readable resource router. This is an allowlist of read-only starting
# points, not an instruction to install packages or MCP servers automatically.
schema = 1

[[resources]]
id = "react-docs"
kind = "library-docs"
source = "https://react.dev/"
trust = "official"
access = "read-only"
mcp = "context7"
scope = "web"
summary = "Official React documentation and versioned API guidance."

